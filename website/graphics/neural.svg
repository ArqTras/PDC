<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" role="img">
  <title>PDC transfer as a network</title>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39ff88"/>
      <stop offset="1" stop-color="#3bc7ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="880" height="460" rx="18" fill="#07091a"/>
  <g opacity="0.35" stroke="#39ff88" stroke-width="0.6">
    <path d="M0 40h880M0 120h880M0 200h880M0 280h880M0 360h880"/>
    <path d="M80 0v460M200 0v460M320 0v460M440 0v460M560 0v460M680 0v460M800 0v460"/>
  </g>
  <g fill="#39ff88" font-family="IBM Plex Mono, monospace" font-size="11" opacity="0.55">
    <text x="24" y="28">01 PDC 10 11</text>
    <text x="700" y="28">HF4 / 15</text>
    <text x="24" y="446">RandomARQ / 60s</text>
    <text x="690" y="446">Zarcanum</text>
  </g>
  <g stroke="url(#line)" stroke-width="1.6" fill="none" filter="url(#glow)">
    <path d="M160 230 H300"/>
    <path d="M430 120 L430 190"/>
    <path d="M430 270 L430 340"/>
    <path d="M560 230 H700"/>
    <path d="M430 230 L560 120"/>
    <path d="M430 230 L560 340"/>
  </g>
  <g font-family="IBM Plex Mono, monospace" text-anchor="middle">
    <g>
      <circle cx="120" cy="230" r="46" fill="#10132b" stroke="#e21e80" stroke-width="2"/>
      <text x="120" y="226" fill="#fff" font-size="13">WALLET</text>
      <text x="120" y="244" fill="#39ff88" font-size="11">Px addr</text>
    </g>
    <g>
      <rect x="300" y="188" width="160" height="84" rx="16" fill="#10132b" stroke="#3bc7ff" stroke-width="2"/>
      <text x="380" y="222" fill="#fff" font-size="14">PDC TX</text>
      <text x="380" y="244" fill="#b7bdd6" font-size="11">sealed proof</text>
    </g>
    <g>
      <circle cx="620" cy="110" r="40" fill="#10132b" stroke="#39ff88" stroke-width="2"/>
      <text x="620" y="106" fill="#fff" font-size="12">STEALTH</text>
      <text x="620" y="124" fill="#39ff88" font-size="11">1-time</text>
    </g>
    <g>
      <circle cx="760" cy="230" r="40" fill="#10132b" stroke="#3bc7ff" stroke-width="2"/>
      <text x="760" y="226" fill="#fff" font-size="12">CLSAG</text>
      <text x="760" y="244" fill="#3bc7ff" font-size="11">15 decoys</text>
    </g>
    <g>
      <circle cx="620" cy="350" r="40" fill="#10132b" stroke="#e21e80" stroke-width="2"/>
      <text x="620" y="346" fill="#fff" font-size="12">ASSET</text>
      <text x="620" y="364" fill="#e21e80" font-size="11">blind id</text>
    </g>
    <g>
      <rect x="360" y="40" width="140" height="64" rx="14" fill="#10132b" stroke="#39ff88" stroke-width="2"/>
      <text x="430" y="68" fill="#fff" font-size="12">BPP+</text>
      <text x="430" y="86" fill="#39ff88" font-size="11">hidden amount</text>
    </g>
    <g>
      <rect x="360" y="356" width="140" height="64" rx="14" fill="#10132b" stroke="#3bc7ff" stroke-width="2"/>
      <text x="430" y="384" fill="#fff" font-size="12">ZARCANUM</text>
      <text x="430" y="402" fill="#3bc7ff" font-size="11">hidden stake</text>
    </g>
  </g>
</svg>
